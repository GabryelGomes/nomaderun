<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Casos de Uso</title>
<style>
  body { margin: 0; background: #fff; font-family: "Inter", "Segoe UI", Arial, sans-serif; }
  svg text { font-size: 15px; fill: #111; }
  .uc { fill: #fff; stroke: #222; stroke-width: 1.6; }
  .uc.main { fill: #e6fbff; stroke: #0092a3; stroke-width: 2.4; }
  .line { stroke: #333; stroke-width: 1.3; fill: none; }
  .dash { stroke: #555; stroke-width: 1.3; stroke-dasharray: 6 4; fill: none; }
  .actor { stroke: #111; stroke-width: 2; fill: none; }
  .sys { fill: #fafafa; stroke: #111; stroke-width: 2; }
  .stereo { font-size: 13px; font-style: italic; fill: #444; }
  .title { font-size: 20px; font-weight: 700; }
  .lbl { font-weight: 600; }
  .sec { fill: #666; font-size: 12px; }
</style>
</head>
<body>
<svg id="d" xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940">
  <defs>
    <marker id="open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#555" stroke-width="1.5"/>
    </marker>
    <marker id="gen" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#fff" stroke="#111" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect class="sys" x="270" y="30" width="860" height="880" rx="8"/>
  <text class="title" x="290" y="62">Sistema NOMADE RUN</text>
  <g id="g"></g>
</svg>
<script>
const NS = "http://www.w3.org/2000/svg";
const g = document.getElementById("g");
function el(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text) e.textContent = text;
  g.appendChild(e);
  return e;
}
const RX = 140, RY = 28;
const C1 = 520, C2 = 900;
const col1 = [
  [100, "Cadastrar-se / Autenticar"],
  [190, "Escolher Facção"],
  [280, "Desafiar Fantasma"],
  [370, "UC-01 Correr e Conquistar", true],
  [460, "UC-02 Defender Território", true],
  [550, "UC-03 Analisar Mapa de Calor", true],
  [640, "Ver Feed e Rankings"],
  [730, "Gerenciar Perfil"],
  [820, "Gerenciar Crew"],
];
const col2 = {
  validar: [300, "Validar Atividade (Antifraude)"],
  alerta: [440, "Receber Alerta de Invasão"],
  mapa: [585, "Visualizar Mapa de Território"],
  moderar: [730, "Moderar Atividades"],
  config: [860, "Configurar Temporadas e Zonas"],
};
function actor(x, y, name, secondary) {
  el("circle", { class: "actor", cx: x, cy: y - 34, r: 12 });
  el("line", { class: "actor", x1: x, y1: y - 22, x2: x, y2: y + 10 });
  el("line", { class: "actor", x1: x - 20, y1: y - 10, x2: x + 20, y2: y - 10 });
  el("line", { class: "actor", x1: x, y1: y + 10, x2: x - 16, y2: y + 36 });
  el("line", { class: "actor", x1: x, y1: y + 10, x2: x + 16, y2: y + 36 });
  const t = el("text", { x, y: y + 56, "text-anchor": "middle", class: "lbl" }, name);
  if (secondary) el("text", { x, y: y + 72, "text-anchor": "middle", class: "sec" }, "(ator secundário)");
}
function uc(cx, cy, label, main) {
  el("ellipse", { class: "uc" + (main ? " main" : ""), cx, cy, rx: RX, ry: RY });
  el("text", { x: cx, y: cy + 5, "text-anchor": "middle", class: main ? "lbl" : "" }, label);
}
// Associations from Corredor (drawn first so they stay behind)
const corr = { x: 140, y: 380 };
col1.slice(0, 8).forEach(([y]) => el("line", { class: "line", x1: corr.x + 22, y1: corr.y - 10, x2: C1 - RX, y2: y }));
// Líder de Crew
const lider = { x: 140, y: 740 };
el("line", { class: "line", x1: lider.x + 22, y1: lider.y - 10, x2: C1 - RX, y2: 820 });
el("line", { class: "line", x1: lider.x, y1: lider.y - 50, x2: corr.x, y2: corr.y + 80, "marker-end": "url(#gen)" });
// Right actors
const R = 1270;
const right = [
  ["validar", "Sistema Antifraude", true],
  ["alerta", "Serviço de Notificações", true],
  ["mapa", "Provedor de Mapas", true],
  ["moderar", "Moderador", false],
  ["config", "Administrador", false],
];
right.forEach(([k]) => { const y = col2[k][0]; el("line", { class: "line", x1: C2 + RX, y1: y, x2: R - 24, y2: y - 10 }); });
// include / extend
function dep(x1, y1, x2, y2, label, lx, ly) {
  el("line", { class: "dash", x1, y1, x2, y2, "marker-end": "url(#open)" });
  el("text", { x: lx, y: ly, class: "stereo", "text-anchor": "middle" }, label);
}
dep(C1 + RX - 10, 360, C2 - RX + 6, 310, "«include»", 724, 322);
dep(C1 + RX, 458, C2 - RX, 442, "«include»", 720, 438);
dep(C1 + RX - 6, 558, C2 - RX + 4, 582, "«include»", 720, 560);
dep(C1, 280 + RY, C1, 370 - RY - 2, "«extend»", C1 + 52, 330);
// Use cases
col1.forEach(([y, l, m]) => uc(C1, y, l, m));
Object.values(col2).forEach(([y, l]) => uc(C2, y, l));
actor(corr.x, corr.y, "Corredor");
actor(lider.x, lider.y, "Líder de Crew");
right.forEach(([k, name, sec]) => actor(R, col2[k][0], name, sec));
</script>
</body>
</html>
