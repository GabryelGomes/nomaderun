<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipos de motion · NOMADE RUN (F1, E5)</title>
<!--
  Protótipos da Equipe E5 (F1). HTML/CSS/JS puro, sem biblioteca: Web Animations API.
  Uso: prototipo.html?cena=zona|zona-corrida|bau|chefao|chefao-derrota|time|resumo[&reduzido=1][&pular=3000][&raridade=raro|lendario|comum][&t=800]
  Sem `t` a cena toca sozinha em loop; com `t` fica congelada naquele instante (é assim que os quadros são gravados).
  Todos os números (duração, atraso, curva, vibração) são os mesmos do relatório 05-motion-e-feedback.md.
  Arte (chefão, baú, emblema) é PROVISÓRIA: a E4 entrega a definitiva; aqui só a forma e o movimento contam.
-->
<style>
  :root {
    --bg: #070708; --surface: #0F1013; --sunken: #15161A; --line: #24252B; --ink: #F3F1ED; --ink2: #A8A6A1;
    --orange: #FF6A13; --orangeText: #FF7A2A;
    --striders: #2FA8FF; --volt: #19E6A8; --owls: #FF2D55; --coyotes: #FFD60A;
    --team: var(--owls);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; color: var(--ink); font-family: Inter, system-ui, sans-serif; }
  #stage { display: flex; width: 690px; height: 844px; }
  .phone { position: relative; width: 390px; height: 844px; background: var(--bg); overflow: hidden; flex: none; }
  aside { width: 300px; height: 844px; background: #0B0B0D; border-left: 1px solid var(--line); padding: 20px 18px; display: flex; flex-direction: column; gap: 14px; font-size: 13px; color: var(--ink2); }
  aside h1 { font-size: 17px; color: var(--ink); font-weight: 700; letter-spacing: -0.2px; }
  aside .t { font: 700 34px/1 "Inter Display", Inter, sans-serif; color: var(--ink); font-variant-numeric: tabular-nums; }
  aside .t small { font-size: 14px; color: var(--ink2); font-weight: 500; }
  .track { position: relative; height: 54px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  .track .mk { position: absolute; top: 8px; width: 3px; height: 38px; border-radius: 2px; }
  .track .lbl { position: absolute; bottom: -18px; font-size: 10px; color: var(--ink2); transform: translateX(-50%); white-space: nowrap; }
  .track .ph { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
  .legend { display: grid; grid-template-columns: 1fr; gap: 6px; margin-top: 10px; }
  .legend div { display: flex; gap: 8px; align-items: center; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .steps { display: flex; flex-direction: column; gap: 5px; overflow: hidden; }
  .steps div { padding: 5px 8px; border-radius: 6px; border: 1px solid transparent; line-height: 1.3; }
  .steps div.on { border-color: var(--orange); color: var(--ink); background: rgba(255,106,19,0.10); }
  .tag { display: inline-block; font-size: 11px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink2); }
  .tag.on { color: #111; background: var(--orange); border-color: var(--orange); font-weight: 700; }

  /* telefone */
  .status { position: absolute; top: 0; left: 0; right: 0; height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; font-size: 14px; font-weight: 600; z-index: 50; }
  .vibra { position: absolute; top: 52px; right: 14px; z-index: 60; font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: #fff; color: #111; opacity: 0; letter-spacing: .3px; }
  .demo { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 10px; color: #5c5b58; z-index: 70; }
  .abs { position: absolute; }
  .center { display: flex; align-items: center; justify-content: center; }
  .h-hero { font: 800 72px/0.95 "Inter Display", Inter, sans-serif; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
  .h-head { font: 800 30px/1.05 "Inter Display", Inter, sans-serif; letter-spacing: -0.6px; }
  .h-title { font: 700 18px/1.2 Inter, sans-serif; }
  .small { font-size: 13px; color: var(--ink2); }
  .caption { font-size: 11px; color: var(--ink2); }
  .word { display: inline-block; overflow: hidden; vertical-align: bottom; padding: 0 0.12em; }
  .word > span { display: inline-block; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; }
  .btn { height: 60px; border-radius: 16px; background: var(--orange); color: #111; font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 28px rgba(255,106,19,.55), 0 0 8px rgba(255,106,19,.6); }
  .btn.ghost { background: transparent; color: var(--ink); box-shadow: none; border: 1px solid var(--line); }
  .pill { height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: rgba(15,16,19,.85); display: flex; align-items: center; font-size: 13px; font-weight: 700; gap: 6px; }
  .bar { position: relative; height: 14px; border-radius: 999px; background: var(--sunken); overflow: hidden; border: 1px solid var(--line); }
  .bar > div { position: absolute; inset: 0; transform-origin: left center; border-radius: 999px; }
  .particle { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
  .num { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="stage">
  <div class="phone" id="phone">
    <div class="status"><span>9:41</span><span>5G ▮▮▮</span></div>
    <div class="vibra" id="vibra">VIBRA</div>
    <div class="demo">Protótipo de motion · dados de demonstração · arte provisória</div>
  </div>
  <aside id="panel"></aside>
</div>
<script>
'use strict';
const Q = new URLSearchParams(location.search);
const SCENE = Q.get('cena') || 'zona';
const REDUCED = Q.get('reduzido') === '1';
const SKIP_AT = Q.has('pular') ? Number(Q.get('pular')) : null;
const RARITY = Q.get('raridade') || 'raro';
const FIXED_T = Q.has('t') ? Number(Q.get('t')) : null;

/* ---------- tokens (espelho de src/theme/motion.ts + propostas da E5) ---------- */
const CURVE = {
  standard: 'cubic-bezier(0.25,0.46,0.45,0.94)', // power2.out
  enter: 'cubic-bezier(0.215,0.61,0.355,1)',     // power3.out
  reveal: 'cubic-bezier(0.19,1,0.22,1)',         // expo.out
  screen: 'cubic-bezier(0.87,0,0.13,1)',         // expo.inOut
  swap: 'cubic-bezier(0.455,0.03,0.515,0.955)',  // power2.inOut
  exit: 'cubic-bezier(0.55,0.055,0.675,0.19)',   // power3.in (proposta: saídas)
  linear: 'linear',
};
/** Mola amortecida amostrada como `linear(...)` — a mesma técnica serve para as animações CSS do Reanimated 4.5. */
function springLinear(zeta, n = 48) {
  const pts = [];
  const w = zeta < 1 ? Math.log(1000) / zeta : 9.23;
  const wd = w * Math.sqrt(Math.max(1e-6, 1 - zeta * zeta));
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const x = zeta < 1 ? 1 - Math.exp(-zeta * w * t) * (Math.cos(wd * t) + ((zeta * w) / wd) * Math.sin(wd * t)) : 1 - Math.exp(-w * t) * (1 + w * t);
    pts.push(i === n ? 1 : +x.toFixed(4));
  }
  return `linear(${pts.join(', ')})`;
}
const SPRING = {
  snappy: { zeta: 0.8, d: 350 },  // toasts, chips, troca de estado
  gentle: { zeta: 1.0, d: 500 },  // cards, folhas, layout
  bouncy: { zeta: 0.5, d: 650 },  // item do baú, emblema, nível
  stamp: { zeta: 0.42, d: 550 },  // carimbo PR, "derrotado", número do nível
};
const SP = Object.fromEntries(Object.entries(SPRING).map(([k, v]) => [k, springLinear(v.zeta)]));

const C = { bg: '#070708', surface: '#0F1013', line: '#24252B', ink: '#F3F1ED', ink2: '#A8A6A1', orange: '#FF6A13', white: '#FFFFFF' };
const TEAM = { striders: '#2FA8FF', volt: '#19E6A8', owls: '#FF2D55', coyotes: '#FFD60A' };
const RARE = { comum: '#C9C6BF', raro: '#9B6BFF', lendario: '#FFB800' };
const ME = 'owls';

/* ---------- utilidades ---------- */
const phone = document.getElementById('phone');
const tickers = [];
const haptics = []; // {t, kind}
const steps = [];   // {t0, t1, text}
let TOTAL = 2000;

function el(tag, style = {}, parent = phone, html) {
  const e = document.createElement(tag);
  Object.assign(e.style, style);
  if (html !== undefined) e.innerHTML = html;
  parent.appendChild(e);
  return e;
}
function svgEl(tag, attrs, parent) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}
/** Partícula: escondida até começar (sem preenchimento para trás). */
function AP(node, frames, { d, delay = 0, e = 'linear' }) {
  node.style.opacity = 0;
  return node.animate(frames, { duration: d, delay, easing: e, fill: 'forwards' });
}
/** Uma animação (WAAPI). `d` duração, `delay`, `e` curva. Sempre `fill: both` (estado inicial antes do atraso). */
function A(node, frames, { d, delay = 0, e = CURVE.standard, it = 1, dir = 'normal' }) {
  return node.animate(frames, { duration: d, delay, easing: e, fill: 'both', iterations: it, direction: dir });
}
const fade = (node, delay, d = 150, from = 0, to = 1) => A(node, [{ opacity: from }, { opacity: to }], { d, delay, e: CURVE.standard });
function haptic(t, kind) { haptics.push({ t, kind }); }
function step(t0, t1, text) { steps.push({ t0, t1, text }); }
/** Número que conta (CountUp) — seekável: o texto é função do tempo. */
function ticker(node, { from = 0, to, delay = 0, d = 1000, ease = expoOut, fmt = (n) => Math.round(n).toLocaleString('pt-BR') }) {
  tickers.push((t) => {
    const p = Math.min(1, Math.max(0, (t - delay) / d));
    node.textContent = fmt(from + (to - from) * ease(p));
  });
}
function expoOut(t) { return t >= 1 ? 1 : 1 - Math.pow(2, -10 * t); }
function rnd(seed) { let s = seed; return () => ((s = (s * 16807) % 2147483647) / 2147483647); }
/** Palavras que sobem de dentro da máscara (RevealText). */
function reveal(parent, text, { delay = 0, stagger = 60, d = 600, cls = 'h-head', color } = {}) {
  const wrap = el('div', { textAlign: 'center', color: color || C.ink }, parent);
  wrap.className = cls;
  text.split(' ').forEach((w, i) => {
    const m = el('span', {}, wrap); m.className = 'word';
    const s = el('span', {}, m, w);
    if (REDUCED) fade(s, delay ? 0 : 0, 150);
    else A(s, [{ transform: 'translateY(105%)' }, { transform: 'translateY(0)' }], { d, delay: delay + i * stagger, e: CURVE.reveal });
  });
  return wrap;
}
/**
 * Confete físico (lançamento + gravidade + arrasto), amostrado em 14 quadros-chave por partícula.
 * Orçamento: pequeno 0 · médio 24 · épico 60 (nunca mais). Só transform/opacidade.
 */
function confetti(parent, { x, y, n = 24, colors, delay = 0, spread = [-160, -20], speed = [420, 780], g = 1500, life = [900, 1300], seed = 7, size = 1, xs = 0 }) {
  if (REDUCED) return;
  const r = rnd(seed);
  for (let i = 0; i < n; i++) {
    const p = el('div', { width: `${(6 + r() * 5) * size}px`, height: `${(9 + r() * 7) * size}px`, background: colors[i % colors.length], borderRadius: r() < 0.3 ? '50%' : '2px' }, parent);
    p.className = 'particle';
    const ang = ((spread[0] + r() * (spread[1] - spread[0])) * Math.PI) / 180;
    const v = speed[0] + r() * (speed[1] - speed[0]);
    const vx = Math.cos(ang) * v, vy = Math.sin(ang) * v;
    const x0 = x + (r() - 0.5) * 2 * xs;
    const L = life[0] + r() * (life[1] - life[0]);
    const spin = (r() - 0.5) * 900;
    const frames = [];
    for (let k = 0; k <= 13; k++) {
      const tt = (k / 13) * (L / 1000);
      const drag = 1 - Math.exp(-2.2 * tt);
      const px = x0 + (vx / 2.2) * drag;
      const py = y + (vy / 2.2) * drag + 0.5 * g * tt * tt * 0.55;
      frames.push({ transform: `translate(${px}px, ${py}px) rotate(${spin * tt}deg) scale(${k === 0 ? 0.4 : 1})`, opacity: k / 13 > 0.7 ? 1 - (k / 13 - 0.7) / 0.3 : 1 });
    }
    AP(p, frames, { d: L, delay: delay + r() * 40 });
  }
}
/** Faíscas radiais curtas (golpe, fechar anel). */
function sparks(parent, { x, y, n = 8, color = '#fff', delay = 0, len = 26, dist = 54, d = 280, seed = 3 }) {
  if (REDUCED) return;
  const r = rnd(seed);
  for (let i = 0; i < n; i++) {
    const a = (i / n) * 360 + r() * 20;
    const s = el('div', { width: `${len}px`, height: '3px', background: color, borderRadius: '2px', transformOrigin: '0 50%' }, parent);
    s.className = 'particle';
    AP(s, [
      { transform: `translate(${x}px, ${y}px) rotate(${a}deg) translateX(8px) scaleX(0.2)`, opacity: 1 },
      { transform: `translate(${x}px, ${y}px) rotate(${a}deg) translateX(${dist * 0.6}px) scaleX(1)`, opacity: 1, offset: 0.4 },
      { transform: `translate(${x}px, ${y}px) rotate(${a}deg) translateX(${dist}px) scaleX(0.1)`, opacity: 0 },
    ], { d, delay, e: CURVE.standard });
  }
}
/** Selo do time (losango dos Night Owls). */
function emblem(parent, size, color) {
  const s = svgEl('svg', { width: size, height: size, viewBox: '0 0 100 100' }, parent);
  svgEl('rect', { x: 22, y: 22, width: 56, height: 56, rx: 8, transform: 'rotate(45 50 50)', fill: 'none', stroke: color, 'stroke-width': 9 }, s);
  svgEl('rect', { x: 38, y: 38, width: 24, height: 24, rx: 4, transform: 'rotate(45 50 50)', fill: color }, s);
  return s;
}

/* ========================================================================== */
/* CENA 1 — Zona conquistada (resumo): anel fecha, confete na cor do time, número sobe (1,2 s) */
function sceneZona() {
  TOTAL = 1800;
  const team = TEAM[ME];
  el('div', { left: '24px', top: '64px' }, phone, '<span class="caption">RESUMO DA CORRIDA</span>').className = 'abs';
  const card = el('div', { left: '16px', right: '16px', top: '96px', height: '380px', boxShadow: '0 0 30px rgba(255,106,19,0.22)', borderColor: C.orange }, phone);
  card.className = 'card abs';
  const SIZE = 150, STROKE = 11, R = (SIZE - STROKE) / 2, LEN = 2 * Math.PI * R, GAP = 5, SEG = (LEN * (60 - GAP)) / 360;
  const back = el('div', { inset: '0', overflow: 'visible' }, card); back.className = 'abs';
  const ringBox = el('div', { left: '50%', top: '48px', width: SIZE + 'px', height: SIZE + 'px', marginLeft: -SIZE / 2 + 'px', borderRadius: '50%' }, card);
  ringBox.className = 'abs';
  const glow = el('div', { inset: '0', borderRadius: '50%', boxShadow: `0 0 40px ${team}88` }, ringBox); glow.className = 'abs';
  const base = svgEl('svg', { width: SIZE, height: SIZE }, ringBox); base.style.position = 'absolute';
  svgEl('circle', { cx: SIZE / 2, cy: SIZE / 2, r: R, fill: '#15161A', stroke: C.line, 'stroke-width': STROKE }, base);
  for (let i = 0; i < 6; i++) {
    const w = el('div', { inset: '0', transform: `rotate(${-90 + i * 60 + GAP / 2}deg)` }, ringBox); w.className = 'abs';
    const s = svgEl('svg', { width: SIZE, height: SIZE }, w);
    const c = svgEl('circle', { cx: SIZE / 2, cy: SIZE / 2, r: R, fill: 'none', stroke: team, 'stroke-width': STROKE, 'stroke-linecap': 'round', 'stroke-dasharray': `${SEG} ${LEN}` }, s);
    if (REDUCED) c.style.strokeDashoffset = 0;
    else A(c, [{ strokeDashoffset: SEG }, { strokeDashoffset: 0 }], { d: 420, delay: i * 60, e: CURVE.reveal });
  }
  const em = el('div', { inset: '0' }, ringBox); em.className = 'abs center';
  emblem(em, 74, team);
  if (REDUCED) { fade(ringBox, 0); }
  else {
    A(em, [{ transform: 'scale(0.5)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { d: SPRING.bouncy.d, delay: 540, e: SP.bouncy });
    A(glow, [{ transform: 'scale(1)', opacity: 0.4 }, { transform: 'scale(1.12)', opacity: 1, offset: 0.35 }, { transform: 'scale(1)', opacity: 0.8 }], { d: 420, delay: 720, e: CURVE.standard });
    A(ringBox, [{ transform: 'scale(1)' }, { transform: 'scale(1.06)', offset: 0.3 }, { transform: 'scale(1)' }], { d: 400, delay: 720, e: CURVE.standard });
    sparks(back, { x: 179, y: 123, n: 10, color: team, delay: 720, dist: 110, len: 22 });
  }
  const txt = el('div', { left: '0', right: '0', top: '230px', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '10px' }, card); txt.className = 'abs';
  reveal(txt, 'Zona conquistada', { delay: 660 });
  const sub = el('div', { fontSize: '17px', color: '#FF7A2A', fontWeight: 700 }, txt, '+<span class="num" id="rp">0</span> pontos em Setor Bueno');
  ticker(sub.querySelector('#rp'), { to: 120, delay: REDUCED ? -1 : 860, d: REDUCED ? 1 : 600 });
  if (REDUCED) fade(sub, 0); else A(sub, [{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'none' }], { d: 500, delay: 820, e: CURVE.enter });
  const chips = el('div', { display: 'flex', gap: '8px', marginTop: '10px' }, txt);
  ['Nível da zona 1', 'Escudo 1/3'].forEach((t, i) => { const c = el('div', {}, chips, t); c.className = 'pill'; if (REDUCED) fade(c, 0); else A(c, [{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { d: 450, delay: 1000 + i * 60, e: CURVE.enter }); });
  confetti(back, { x: 179, y: 123, n: 24, colors: [team, team, '#fff', '#FF7A2A'], delay: 720 });
  if (REDUCED) { haptic(0, 'sucesso'); step(0, 150, 'Tudo aparece com fade de 150 ms; anel já fechado.'); step(0, 150, 'Vibração de sucesso (uma).'); return; }
  haptic(0, 'leve'); haptic(720, 'sucesso');
  step(0, 720, '0–720 ms · 6 traços na cor do time, 60 ms entre eles, 420 ms cada (expo.out).');
  step(540, 1190, '540 ms · selo do time entra com mola "bouncy" (650 ms).');
  step(660, 1260, '660 ms · título por palavras (60 ms, expo.out 600 ms).');
  step(720, 1620, '720 ms · anel fecha: pulso 1,06×, brilho, 10 faíscas, 24 confetes.');
  step(860, 1460, '860 ms · "+120 pontos" conta em 600 ms.');
}

/* CENA 1b — Zona conquistada durante a corrida (leve: toast + brilho na borda, sem partícula) */
function sceneZonaCorrida() {
  TOTAL = 3200;
  const team = TEAM[ME];
  const mapBox = el('div', { left: '0', right: '0', top: '0', height: '330px', background: '#0b0c0f' }, phone); mapBox.className = 'abs';
  const s = svgEl('svg', { width: 390, height: 330 }, mapBox);
  for (let i = 0; i < 9; i++) svgEl('path', { d: `M${-20 + i * 55} 0 L${40 + i * 45} 330`, stroke: '#1b1c21', 'stroke-width': 6 }, s);
  for (let i = 0; i < 6; i++) svgEl('path', { d: `M0 ${30 + i * 60} L390 ${10 + i * 62}`, stroke: '#1b1c21', 'stroke-width': 5 }, s);
  const zone = svgEl('path', { d: 'M150 120 C190 90 260 100 270 150 C285 200 230 240 180 230 C130 222 115 160 150 120 Z', fill: team, 'fill-opacity': 0.0, stroke: team, 'stroke-width': 2, 'stroke-opacity': 0.6 }, s);
  svgEl('path', { d: 'M40 300 C90 260 120 240 160 200 S 230 160 250 150', fill: 'none', stroke: team, 'stroke-width': 6, 'stroke-linecap': 'round' }, s);
  svgEl('circle', { cx: 250, cy: 150, r: 9, fill: '#fff', stroke: team, 'stroke-width': 4 }, s);
  if (REDUCED) A(zone, [{ fillOpacity: 0.0 }, { fillOpacity: 0.45 }], { d: 150, e: CURVE.standard });
  else A(zone, [{ fillOpacity: 0.0 }, { fillOpacity: 0.6, offset: 0.4 }, { fillOpacity: 0.42 }], { d: 600, e: CURVE.standard });
  const stats = el('div', { left: '0', right: '0', top: '360px', textAlign: 'center' }, phone); stats.className = 'abs';
  el('div', {}, stats, '<div class="caption">TEMPO</div><div class="h-hero" style="font-size:88px">18:42</div>');
  el('div', { display: 'flex', justifyContent: 'space-around', marginTop: '26px' }, stats, '<div><div class="caption">DISTÂNCIA</div><div class="h-head num">3,12 km</div></div><div><div class="caption">RITMO</div><div class="h-head num">5\'58"</div></div>');
  el('div', { left: '24px', right: '24px', top: '640px' }, phone, '<div class="small" style="margin-bottom:8px">Próxima zona: faltam 380 m</div><div class="bar"><div style="background:' + team + ';transform:scaleX(.42)"></div></div>').className = 'abs';
  // brilho periférico na cor do time (inset), nunca tela cheia durante a corrida
  const edge = el('div', { inset: '0', boxShadow: `inset 0 0 0 3px ${team}, inset 0 0 70px ${team}aa`, pointerEvents: 'none', zIndex: 40 }, phone); edge.className = 'abs';
  if (REDUCED) A(edge, [{ opacity: 0 }, { opacity: 0.8, offset: 0.3 }, { opacity: 0 }], { d: 600, e: CURVE.standard });
  else A(edge, [{ opacity: 0 }, { opacity: 1, offset: 0.25 }, { opacity: 0 }], { d: 600, e: CURVE.standard });
  const toast = el('div', { left: '12px', right: '12px', top: '50px', height: '76px', borderRadius: '18px', background: '#111216', border: `1.5px solid ${team}`, boxShadow: `0 0 26px ${team}66`, display: 'flex', alignItems: 'center', gap: '12px', padding: '0 14px', zIndex: 45 }, phone);
  toast.className = 'abs';

  el('div', { textAlign: 'center', marginBottom: '6px' }, title, '<span class="caption" style="color:#fff">VOCÊ AGORA CORRE COM OS</span>');

  const k = 2.2 * Math.hypot(390, 844) / 80;

    fade(dark, 0, 250); rings.forEach((r) => (r.style.opacity = 0));

  A(btn, [{ transform: 'scale(1)' }, { transform: 'scale(0.97)' }, { transform: 'scale(1)' }], { d: 240, e: CURVE.standard });
  A(scene, [{ opacity: 0 }, { opacity: 1 }], { d: 200, delay: 450, e: CURVE.standard });

  step(0, 240, '0 ms · toque: botão 0,97× (120 ms) e volta.');

  step(750, 1500, '750 ms · "NIGHT OWLS" sobe por palavras (70 ms).');
  step(1150, 1650, '1.150 ms · frase do líder (fade + 16 px, 500 ms).');
  step(1600, 2000, '1.600 ms · "Bora correr" aparece; tocável desde já.');
}

  const miniGhost = el('div', { position: 'absolute', inset: 0, background: '#FFE3C2', transformOrigin: 'left', transform: 'scaleX(.36)' }, mini);

  const R = REDUCED;

    const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; // power2.inOut
    route.style.strokeDashoffset = String(1 - e);

  // momento 1: zona (médio, 1.100 ms)
  enter(zoneRow.c, T.zone); glowRow(zoneRow.c, T.zone + 200, team);
  A(zoneRow.ic, [{ transform: 'scale(.5) rotate(-90deg)' }, { transform: 'scale(1) rotate(0)' }], { d: SPRING.bouncy.d, delay: T.zone + 150, e: SP.bouncy });
  confetti(list, { x: 30, y: 40, n: 12, colors: [team, '#fff'], delay: T.zone + 400, spread: [-120, -10], speed: [250, 420], g: 900, life: [700, 900], seed: 31 });

  A(skip, [{ opacity: 1 }, { opacity: 0 }], { d: 200, delay: T.end - 200 });
  step(0, 1700, 'Ato 1 · Rota (200–1.700 ms): traço da rota desenha em 1,5 s (power2.inOut) com cometa; 3 zonas pintam quando a rota passa (seleção leve em cada).');
  step(1700, 2700, 'Ato 2 · Números (1.700 ms): distância conta 900 ms; tempo, ritmo e pontos entram a cada 120 ms. Vibração leve quando a distância "pousa".');
  step(2700, 3800, 'Ato 3a · Zona conquistada (médio, 1.100 ms): card entra (mola "gentle"), selo gira, 12 confetes, +120. Sucesso.');
  step(4000, 5000, 'Ato 3b · Baú raro (médio, 1.000 ms): ícone treme e estoura, +40 XP. Leve → média.');
  step(5200, 6000, 'Ato 3c · Dano no chefão (pequeno, 800 ms): barra com fantasma, −8,4 km. Média.');
  step(6200, 8300, 'Ato 4 · XP enche (600 ms) → NÍVEL 7 (épico, 1.500 ms no resumo): raios, carimbo, 60 confetes. Sucesso.');
  step(8200, 9000, 'Final (8,4 s): "Compartilhar no Instagram" pulsa uma vez. "Pular" some.');
}

/* ---------- montagem, painel e relógio ---------- */
const SCENES = { zona: ['Zona conquistada (resumo)', sceneZona], 'zona-corrida': ['Zona conquistada (corrida)', sceneZonaCorrida], bau: ['Abertura de baú', sceneBau], chefao: ['Golpe no chefão', sceneChefao], 'chefao-derrota': ['Chefão derrotado', sceneChefaoDerrota], time: ['Confirmação do time', sceneTime], resumo: ['Resumo cinematográfico', sceneResumo] };
const [TITLE, build] = SCENES[SCENE] || SCENES.zona;
build();
const HCOLOR = { 'seleção': '#7d7b77', leve: '#C9C6BF', 'média': '#FF7A2A', forte: '#FF2D55', sucesso: '#19E6A8' };
const panel = document.getElementById('panel');
const vibra = document.getElementById('vibra');
function renderPanel(t) {
  const tt = Math.round(t);
  const on = (s) => t >= s.t0 && t <= s.t1 + 60;
  panel.innerHTML = `
    <h1>${TITLE}</h1>
    <div><span class="tag ${REDUCED ? 'on' : ''}">Reduzir movimento: ${REDUCED ? 'ligado' : 'desligado'}</span>${SKIP_AT !== null ? ` <span class="tag on">Pular em ${SKIP_AT} ms</span>` : ''}</div>
    <div class="t">${tt.toLocaleString('pt-BR')}<small> ms</small></div>
    <div class="caption">VIBRAÇÃO (expo-haptics) · mínimo 150 ms entre toques</div>
    <div class="track">${haptics.map((h) => `<div class="mk" style="left:${(h.t / TOTAL) * 100}%;background:${HCOLOR[h.kind]}"></div><div class="lbl" style="left:${(h.t / TOTAL) * 100}%">${h.t}</div>`).join('')}<div class="ph" style="left:${Math.min(100, (t / TOTAL) * 100)}%"></div></div>
    <div class="legend">${[...new Set(haptics.map((h) => h.kind))].map((k) => `<div><i style="background:${HCOLOR[k]}"></i>${k}</div>`).join('')}</div>
    <div class="caption" style="margin-top:4px">COREOGRAFIA</div>
    <div class="steps">${steps.map((s) => `<div class="${on(s) ? 'on' : ''}">${s.text}</div>`).join('')}</div>`;
  const h = haptics.find((x) => t >= x.t && t < x.t + 160);
  vibra.style.opacity = h ? 1 : 0;
  vibra.textContent = h ? `VIBRA · ${h.kind}` : '';
  if (h) vibra.style.background = HCOLOR[h.kind];
}
window.seek = (t) => {
  const eff = SKIP_AT !== null && t >= SKIP_AT ? 1e6 : t;
  document.getAnimations().forEach((a) => { a.pause(); a.currentTime = eff; });
  tickers.forEach((f) => f(eff));
  renderPanel(t);
};
window.TOTAL = TOTAL;
if (FIXED_T !== null) window.seek(FIXED_T);
else {
  let t0 = performance.now();
  const loop = (now) => { let t = now - t0; if (t > TOTAL + 800) { t0 = now; t = 0; } window.seek(t); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
