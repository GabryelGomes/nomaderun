# Proposta da E10 (F1) para .github/workflows/ci.yml — NÃO está ativa.
# Plano A: o coordenador copia este arquivo para .github/workflows/ci.yml no fechamento da F3.
# Plano B (token sem a permissão `workflow`): o dono copia pelo site do GitHub (Add file → Create new file).
# Detalhes, riscos e como validar: docs/melhoria/ci/README.md.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (tipos, lint, testes, cobertura do domain)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Tipos (tsc --noEmit)
        run: npm run typecheck

      - name: Lint (ESLint, binário direto)
        run: ./node_modules/.bin/eslint src --max-warnings 0

      - name: Testes (Jest)
        # Os *.local.test.ts se pulam sozinhos sem Supabase local (26 pulados na linha de base).
        run: npx jest --ci

      - name: Cobertura do domain (mínimo 90%, regra 16.5 do prompt mestre)
        run: >
          npx jest --ci --coverage src/domain
          --coverageThreshold='{"./src/domain/":{"statements":90,"branches":90,"functions":90,"lines":90}}'

  web:
    name: Export web (modo demonstração e prévia)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: app
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Export web
        # --clear: o cache do Metro não percebe mudança de EXPO_PUBLIC_* (achado da linha de base da E10).
        # Quando o modo demonstração existir (T7.E10.1), acrescentar EXPO_PUBLIC_DEMO=1 aqui.
        run: npx expo export -p web --clear --output-dir dist-web
        env:
          EXPO_OFFLINE: '1'

      - name: Tamanho do bundle (orçamento)
        # Linha de base 2026-10-23: entry 3.464.108 B (889.454 B gzip). Orçamento: +10%.
        run: |
          f=$(ls dist-web/_expo/static/js/web/entry-*.js)
          raw=$(stat -c%s "$f"); gz=$(gzip -9c "$f" | wc -c)
          echo "entry: ${raw} B (${gz} B gzip)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$gz" -le 980000 || { echo "::error::bundle web acima do orçamento (${gz} B gzip > 980000)"; exit 1; }

  functions:
    name: Edge Functions (Deno) e ponte do domain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x

      - name: Testes das functions
        run: deno test --allow-read --config supabase/functions/deno.json supabase/functions/tests

      - name: Tipos das functions
        run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts

      - name: Cópia do domain em dia (plano B da D-02)
        run: node supabase/scripts/domain-copy.mjs --check
