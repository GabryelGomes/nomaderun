# D-73: abas Mapa · Arena · Correr · Clube · Você. "Correr" abre a Nova corrida a 1 toque; "Você" agrupa o perfil
# e as Atividades. Os toques nas abas usam o texto/descrição (o testID das abas nativas não chega ao Maestro no Android).
appId: ${APP_ID}
name: Abas Correr e Você
tags: [d-73, navegacao]
---
- runFlow: subflows/entrar-demo.yaml
- tapOn:
    text: "Correr: abrir a Nova corrida"
- extendedWaitUntil:
    visible:
      id: "corrida-comecar"
    timeout: 15000
- tapOn:
    id: "corrida-fechar"
- tapOn:
    text: "Você"
- extendedWaitUntil:
    visible:
      id: "tela-perfil"
    timeout: 15000
- tapOn:
    id: "voce-atividades"
- extendedWaitUntil:
    visible:
      id: "tela-atividades"
    timeout: 15000
