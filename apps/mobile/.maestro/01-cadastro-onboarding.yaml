# RF-001/RF-003/RNF-013, D-72 e D-91 (primeira abertura, valor antes da conta): Boas-vindas → "A cidade está
# dividida" (até 6 s; "Escolher meu time" a partir de 2 s) → escolha do time com as capas → cerimônia (pulável,
# termina em "Continuar") → cadastro enxuto ("Garanta seu lugar nos …": 4 campos, 1 aceite que grava termos e
# privacidade) → GPS com explicação → Mapa com a missão de boas-vindas. O time escolhido antes da conta é gravado
# sozinho depois do cadastro (ninguém escolhe de novo). Notificações NÃO são pedidas aqui (vêm depois da 1ª conquista).
# Conta nova a cada execução.
appId: ${APP_ID}
name: Cadastro e primeira abertura
tags: [auth, rf-001, rf-003, d-72, d-91]
---
- runFlow: subflows/abrir-app.yaml
- evalScript: ${output.stamp = String(Date.now()).slice(-8)}
- tapOn:
    id: "boas-vindas-comecar"
# "A cidade está dividida": passa sozinha em até 6 s; o botão (a partir de 2 s) adianta
- extendedWaitUntil:
    visible:
      id: "tela-cidade|tela-onboarding-times"
    timeout: 30000
- tapOn:
    id: "onboarding-cidade-continuar"
    optional: true
- extendedWaitUntil:
    visible:
      id: "onboarding-times-striders"
    timeout: 15000
- tapOn:
    id: "onboarding-times-striders"
- tapOn:
    id: "onboarding-entrar-time"
# cerimônia (TeamConfirm): a cor do time inunda a tela; termina em "Seu rastro agora é azul" + moldura Recruta
- extendedWaitUntil:
    visible:
      id: "onboarding-confirmacao-continuar"
    timeout: 15000
- tapOn:
    id: "onboarding-confirmacao-continuar"
# cadastro depois da cerimônia: "Garanta seu lugar nos Neon Striders"
- extendedWaitUntil:
    visible:
      id: "tela-cadastro"
    timeout: 10000
- assertVisible:
    id: "cadastro-time"
- tapOn:
    id: "cadastro-email"
- inputText: qa${output.stamp}@nomaderun.test
- tapOn:
    id: "cadastro-senha"
- inputText: Maestro@${output.stamp}
- tapOn:
    id: "cadastro-usuario"
- inputText: qa_${output.stamp}
- tapOn:
    id: "cadastro-nascimento"
- inputText: "15/05/2000"
- hideKeyboard
- tapOn:
    id: "cadastro-aceite"
- tapOn:
    id: "cadastro-botao"
# o time pendente é gravado sozinho ("Guardando seu lugar…") e o app vai direto ao GPS
- extendedWaitUntil:
    visible:
      id: "onboarding-localizacao-permitir"
    timeout: 30000
- assertNotVisible:
    id: "tela-onboarding-times"
- tapOn:
    id: "onboarding-localizacao-permitir"
# diálogo do sistema (Android/iOS): aceita se aparecer
- tapOn:
    text: "(While using the app|Allow while using the app|Permitir durante o uso do app|Ao usar o app|Allow Once|Permitir)"
    optional: true
- extendedWaitUntil:
    visible:
      id: "mapa-status"
    timeout: 30000
- assertVisible:
    id: "mapa-missao-boas-vindas"
- assertVisible:
    id: "mapa-camada"
