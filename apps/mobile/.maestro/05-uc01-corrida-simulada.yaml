# UC-01 (RF-004, RF-006, RF-008): conta nova → Correr → Simulação (demonstração; o GPS real é o padrão, D-76) → contagem → corrida (~4 min de relógio até
# passar pela zona neutra) → segurar para encerrar → resumo OFICIAL com "Zona conquistada".
appId: ${APP_ID}
name: UC-01 Corrida simulada e conquista
tags: [uc-01, rf-004, rf-006, rf-008]
---
- runFlow: 01-cadastro-onboarding.yaml
- tapOn:
    id: "mapa-correr"
- extendedWaitUntil:
    visible:
      id: "corrida-comecar"
    timeout: 15000
- tapOn:
    id: "corrida-missao-livre"
    optional: true
- tapOn:
    id: "corrida-sinal-simulacao"
- tapOn:
    id: "corrida-comecar"
- extendedWaitUntil:
    visible:
      id: "corrida-pausar"
    timeout: 20000
- assertVisible:
    id: "corrida-sos"
# a simulação passa pelo desvio até a zona neutra mais próxima: o painel avisa quando a conquista é provável
# (E-01: é estimativa; quem confirma é o servidor, no resumo)
- extendedWaitUntil:
    visible:
      text: "Conquista provável: confirma no fim"
    timeout: 300000
- longPressOn:
    id: "corrida-encerrar"
- extendedWaitUntil:
    visible:
      id: "tela-resumo"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "resumo-zona-conquistada"
    timeout: 30000
- assertVisible:
    id: "resumo-metricas"
- assertNotVisible:
    id: "resumo-status-provisional"
- tapOn:
    id: "resumo-concluir"
- extendedWaitUntil:
    visible:
      id: "mapa-status"
    timeout: 15000
